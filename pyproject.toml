[project]
name = "okf2spannerknowledgegraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-spanner>=3.71.0",
    "google-genai>=2.24.0",
    "numpy>=2.5.3",
    "okf-core",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
